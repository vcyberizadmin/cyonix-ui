name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Builds both packages, typechecks, and asserts every Tailwind utility the
      # components reference is actually generated by the theme. That last check
      # is the one that catches silent styling regressions.
      - run: pnpm test
