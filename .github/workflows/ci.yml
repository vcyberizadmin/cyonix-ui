name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Per package: build, tsc, the five guard scripts, then the Vitest suite.
      #
      # The guards read artefacts as text — the compiled CSS, the built dist —
      # and catch silent styling regressions no rendered assertion would see.
      # The tests render the components and catch the rest: keyboard contracts,
      # ARIA state, server-safety, date arithmetic, WCAG contrast.
      - run: pnpm test
