# Publishes @vcyberizadmin/theme and @vcyberizadmin/ui on merge to main.
#
# WHY THE SCOPE IS @vcyberizadmin AND NOT @cyonix
# -----------------------------------------------
# GitHub Packages requires a package's npm scope to match the account that owns
# the repository. This repo is owned by `vcyberizadmin`, so `@cyonix/*` is
# rejected with a 403 no matter how the token is configured. The packages are
# named for the registry, not for the product.
#
# To carry the product name instead, either create a GitHub org literally named
# `cyonix` and transfer the repo, or publish to a paid private npm org. Both
# mean renaming the two packages and every import in every consumer.
#
# Consumers need a matching registry mapping in their own .npmrc:
#   @vcyberizadmin:registry=https://npm.pkg.github.com
#   //npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}

name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      # Opens (or updates) a "Version Packages" PR when changesets are pending.
      # Merging that PR bumps versions, writes changelogs, and publishes.
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
