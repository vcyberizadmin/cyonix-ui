# Publishes @cyonix/theme and @cyonix/ui to npmjs.com on merge to main.
#
# WHY NPMJS.COM AND NOT GITHUB PACKAGES
# -------------------------------------
# GitHub Packages requires a package's npm scope to match the account that owns
# the repository, which forced the scope to be `@vcyberizadmin`. It also demands
# an authenticated token for every read, even of a public package, so every
# consumer needed a PAT with `read:packages` just to install.
#
# npmjs.com has neither restriction. Public scoped packages are free, the scope
# is unrelated to the repo owner, and installs need no token or .npmrc at all:
#
#   pnpm add @cyonix/ui @cyonix/theme
#
# The trade is that GitHub Packages can no longer receive these packages, since
# `@cyonix` does not match the `vcyberizadmin` owner. This is a move, not a
# second target.
#
# Requires repository secret NPM_TOKEN: an npm *automation* token (npmjs.com >
# Access Tokens > Generate > Automation). A classic publish token will fail here
# because npm enforces 2FA on publish and only automation tokens are exempt.

name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      # Opens (or updates) a "Version Packages" PR when changesets are pending.
      # Merging that PR bumps versions, writes changelogs, and publishes.
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
