<!--
  The brand typefaces.

  theme.css deliberately references --font-plus-jakarta-sans /
  --font-jetbrains-mono rather than naming families itself, because a Next app
  supplies them through next/font. Storybook is not a Next app, so nothing was
  defining them: `font-family: var(--display)` was invalid at computed-value
  time and silently inherited Storybook's own system font. Every story was being
  reviewed in the wrong typeface, with no error anywhere.

  Loading them here and mapping the three variables in preview.css reproduces
  exactly what next/font does in a consumer, so Storybook now demonstrates the
  host-app contract instead of quietly violating it.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
  rel="stylesheet"
/>
