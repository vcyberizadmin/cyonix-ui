<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Cyonix Design Guidelines</title>
    <meta
      name="description"
      content="The Cyonix design system: tokens, foundations and components, rendered from the live library."
    />
    <!--
      theme.css names no families — it reads --font-space-grotesk / --font-inter
      / --font-jetbrains-mono, which a Next app supplies through next/font. This
      is not a Next app, so it loads them here and maps the three variables in
      main.css, reproducing the host-app contract rather than quietly violating
      it and reviewing every component in the wrong typeface.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
