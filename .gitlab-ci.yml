# Pushes the GitLab `github` branch back to the GitHub `gitlab` branch.
#
# Requires CI/CD variable GITHUB_DEPLOY_KEY of type "File": the private half of
# an SSH key whose public half is registered on the GitHub repository as a deploy
# key with "Allow write access" ticked. See docs/platform-sync.md.
#
# This does not loop with the GitHub Actions workflow: that one only triggers on
# `main`, and this job only ever writes to the `gitlab` branch.

stages:
  - mirror
  - publish

mirror-to-github:
  stage: mirror
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == "github"
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    # A shallow clone cannot be pushed to another host.
    GIT_DEPTH: 0
    GIT_STRATEGY: clone
    GIT_SSH_COMMAND: ssh -i ~/.ssh/github_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
  before_script:
    - apk add --no-cache git openssh-client
    - |
      if [ -z "$GITHUB_DEPLOY_KEY" ]; then
        echo "GITHUB_DEPLOY_KEY is not set. See docs/platform-sync.md."
        exit 1
      fi
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$GITHUB_DEPLOY_KEY" ~/.ssh/github_deploy
    - chmod 600 ~/.ssh/github_deploy
    - ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
  script:
    # No --force. A rejected push means GitHub holds commits that GitLab does
    # not, which needs a human to look at it rather than a clobber.
    - git push git@github.com:vcyberizadmin/cyonix-ui.git HEAD:refs/heads/gitlab

# Publishes @cyonix/theme and @cyonix/ui to this project's npm package registry.
#
# This job predates the move to npmjs.com and is now redundant for most
# consumers: the packages are public on npmjs.com and install with no token and
# no .npmrc. It is kept because it costs seconds when there is nothing to do,
# and it gives GitLab-side CI a registry inside its own trust boundary. Delete
# it, and the .npmrc block in docs/platform-sync.md, if that is not wanted.
#
# Runs on every mirror of `github` but only actually publishes when the version
# in package.json is not in the registry yet, i.e. when a release commit lands.
# Consumers point .npmrc at the project registry; see docs/platform-sync.md.
publish-to-gitlab-registry:
  stage: publish
  image: node:22-alpine
  rules:
    - if: $CI_COMMIT_BRANCH == "github"
  script:
    # Scope registry + job-token auth. Written by the shell so the variables
    # expand here rather than relying on npm's .npmrc interpolation.
    - REGISTRY_PATH="gitlab.com/api/v4/projects/${CI_PROJECT_ID}/packages/npm/"
    - printf '@cyonix:registry=https://%s\n//%s:_authToken=%s\n' "$REGISTRY_PATH" "$REGISTRY_PATH" "$CI_JOB_TOKEN" > .npmrc
    # Decide what needs publishing before paying for install + build.
    - NEED=""
    - |
      for dir in packages/theme packages/ui; do
        name=$(node -p "require('./$dir/package.json').name")
        version=$(node -p "require('./$dir/package.json').version")
        if npm view "$name@$version" version > /dev/null 2>&1; then
          echo "$name@$version already in the registry, skipping"
        else
          echo "$name@$version is new, will publish"
          NEED="$NEED $dir"
        fi
      done
    - if [ -z "$NEED" ]; then echo "Nothing to publish."; exit 0; fi
    - corepack enable
    - pnpm install --frozen-lockfile
    - pnpm build
    # pnpm (not npm) so workspace: protocol ranges are rewritten on publish.
    - |
      for dir in $NEED; do
        (cd "$dir" && pnpm publish --no-git-checks)
      done
