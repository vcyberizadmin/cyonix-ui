# Pushes the GitLab `github` branch back to the GitHub `gitlab` branch.
#
# Requires CI/CD variable GITHUB_DEPLOY_KEY of type "File": the private half of
# an SSH key whose public half is registered on the GitHub repository as a deploy
# key with "Allow write access" ticked. See docs/platform-sync.md.
#
# This does not loop with the GitHub Actions workflow: that one only triggers on
# `main`, and this job only ever writes to the `gitlab` branch.

stages:
  - mirror

mirror-to-github:
  stage: mirror
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == "github"
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    # A shallow clone cannot be pushed to another host.
    GIT_DEPTH: 0
    GIT_STRATEGY: clone
    GIT_SSH_COMMAND: ssh -i ~/.ssh/github_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
  before_script:
    - apk add --no-cache git openssh-client
    - |
      if [ -z "$GITHUB_DEPLOY_KEY" ]; then
        echo "GITHUB_DEPLOY_KEY is not set. See docs/platform-sync.md."
        exit 1
      fi
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$GITHUB_DEPLOY_KEY" ~/.ssh/github_deploy
    - chmod 600 ~/.ssh/github_deploy
    - ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
  script:
    # No --force. A rejected push means GitHub holds commits that GitLab does
    # not, which needs a human to look at it rather than a clobber.
    - git push git@github.com:vcyberizadmin/cyonix-ui.git HEAD:refs/heads/gitlab
